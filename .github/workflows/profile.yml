name: Refresh profile visuals
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *'
  push:
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Update overview
        run: node scripts/update-overview.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: assets/contribution-snake-airy.svg?color_snake=#7caccb&color_dots=#edf5fb,#dcebf5,#c5deee,#a6cbe1,#7caccb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-overview-airy.svg assets/contribution-snake-airy.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile visuals'
            git push
          fi


